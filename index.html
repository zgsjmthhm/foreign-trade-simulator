<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外贸业务员日常模拟器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 桌面背景 -->
    <div class="desktop">
        <!-- 任务栏 -->
        <div class="taskbar">
            <div class="taskbar-left">
                <div class="start-btn">🏢 开始</div>
            </div>
            <div class="taskbar-center">
                <div class="time-display">
                    <div class="time" id="currentTime">09:00</div>
                    <div class="date" id="currentDate">周一</div>
                </div>
            </div>
            <div class="taskbar-right">
                <div class="score-panel">
                    <span class="score-label">今日得分</span>
                    <span class="score-value" id="totalScore">0</span>
                </div>
                <div class="progress-panel">
                    <span class="progress-label">完成进度</span>
                    <span class="progress-value" id="completedCount">0/5</span>
                </div>
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 左侧应用列表 -->
            <div class="sidebar">
                <div class="sidebar-title">📋 今日任务</div>
                <div class="app-list" id="appList">
                    <!-- 应用列表由 JS 动态生成 -->
                </div>
                <div class="sidebar-footer">
                    <button class="btn-reset" id="resetBtn">🔄 重置一天</button>
                </div>
            </div>

            <!-- 中间工作区 -->
            <div class="workspace">
                <!-- 欢迎界面 -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">👋</div>
                    <h1>早上好，新同事！</h1>
                    <p>今天是你入职外贸业务员的第一天</p>
                    <div class="welcome-tasks">
                        <h3>📌 今日待办</h3>
                        <ul>
                            <li>📦 发布 1 个产品到阿里巴巴国际站</li>
                            <li>✉️ 给潜在客户发送开发信</li>
                            <li>📱 在 LinkedIn 发布产品动态</li>
                            <li>🔍 寻找并筛选新客户</li>
                            <li>💬 回复客户询盘</li>
                        </ul>
                    </div>
                    <button class="btn-start" id="startDayBtn">开始今天的工作 →</button>
                </div>

                <!-- 场景窗口 -->
                <div class="scene-window" id="sceneWindow" style="display: none;">
                    <div class="window-header">
                        <div class="window-title" id="windowTitle">任务窗口</div>
                        <div class="window-controls">
                            <button class="btn-minimize">—</button>
                            <button class="btn-close" id="closeSceneBtn">×</button>
                        </div>
                    </div>
                    <div class="window-content" id="windowContent">
                        <!-- 场景内容由 JS 动态生成 -->
                    </div>
                </div>

                <!-- 完成界面 -->
                <div class="complete-screen" id="completeScreen" style="display: none;">
                    <div class="complete-icon">🎉</div>
                    <h1>今天的工作完成了！</h1>
                    <div class="final-score">
                        <div class="score-circle">
                            <span class="score-number" id="finalScore">0</span>
                            <span class="score-total">/ 100</span>
                        </div>
                    </div>
                    <div class="performance-rating" id="performanceRating">
                        <!-- 评级由 JS 动态生成 -->
                    </div>
                    <div class="performance-summary" id="performanceSummary">
                        <!-- 总结由 JS 动态生成 -->
                    </div>
                    <button class="btn-restart" id="restartBtn">🔄 再试一次</button>
                </div>
            </div>
        </div>

        <!-- 反馈弹窗 -->
        <div class="feedback-modal" id="feedbackModal" style="display: none;">
            <div class="feedback-content">
                <div class="feedback-header" id="feedbackHeader">
                    <span class="feedback-icon" id="feedbackIcon">✅</span>
                    <span class="feedback-title" id="feedbackTitle">任务完成</span>
                </div>
                <div class="feedback-score" id="feedbackScore">+20 分</div>
                <div class="feedback-message" id="feedbackMessage">做得不错！</div>
                <div class="feedback-tips" id="feedbackTips">
                    <!-- 建议由 JS 动态生成 -->
                </div>
                <button class="btn-continue" id="continueBtn">继续</button>
            </div>
        </div>
    </div>

    <script src="js/scenes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
